plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.smart_question_practice'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.smart_question_practice"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0-skeleton"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ============ 所有密钥/地址都从环境变量注入，仓库内不保存任何真实值 ============
        def serverUrl = System.getenv("SERVER_URL") ?: "http://127.0.0.1:3000"
        def panelToken = System.getenv("PANEL_TOKEN") ?: ""
        def arkApiKey = System.getenv("ARK_API_KEY") ?: ""
        def deepseekApiKey = System.getenv("DEEPSEEK_API_KEY") ?: ""

        buildConfigField "String", "SERVER_URL", "\"${serverUrl}\""
        buildConfigField "String", "PANEL_TOKEN", "\"${panelToken}\""
        buildConfigField "String", "ARK_API_KEY", "\"${arkApiKey}\""
        buildConfigField "String", "DEEPSEEK_API_KEY", "\"${deepseekApiKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'

    // Navigation：页面路由（nav_graph.xml）
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ViewModel / LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.2'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // 本地数据库（表结构定义见 data/room）
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // 网络层（契约见 network/BizApi.java）
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 统计页图表（可选）：需要时自行添加 MPAndroidChart，并在 dependencyResolutionManagement 中
    // 增加 maven { url 'https://jitpack.io' }

    testImplementation 'junit:junit:4.13.2'
}
